[project]
name = "redactyl"
description = "Defense-in-depth redaction for Python payloads in logs, events, and nested JSON-like data"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Thomas Adamcik", email = "thomas@adamcik.no" }]
keywords = ["logging", "privacy", "redaction", "security", "structured-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = ["version"]

dependencies = []

[project.urls]
Homepage = "https://github.com/adamcik/redactyl"
Issues = "https://github.com/adamcik/redactyl/issues"
Repository = "https://github.com/adamcik/redactyl"

[dependency-groups]
dev = ["basedpyright", "pytest", "ruff"]

[build-system]
requires = ["editables==0.6", "hatch-vcs==0.5.0", "hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/redactyl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D100",  # undocumented-public-module
  "D101",  # undocumented-public-class
  "D102",  # undocumented-public-method
  "D103",  # undocumented-public-function
  "D104",  # undocumented-public-package
  "D105",  # undocumented-magic-method
  "D107",  # undocumented-public-init
  "D203",  # incorrect-blank-line-before-class
  "D213",  # multi-line-summary-second-line
  "EM101",  # raw-string-in-exception
  "EM102",  # f-string-in-exception
  "C901",  # complex-structure
  "PLR0911",  # too-many-return-statements
  "PLR0913",  # too-many-arguments
  "S105",  # hardcoded-password-string
  "TRY003",  # raise-vanilla-args
  # Conflicts with `ruff format`
  "COM812",  # missing-trailing-comma
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "ANN001",  # missing-type-function-argument
  "ANN201",  # missing-return-type-undocumented-public-function
  "ANN204",  # missing-return-type-special-method
  "INP001",  # implicit-namespace-package
  "S101",  # assert
]
